{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  {{- with .Values.annotations.hpa }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "atlas.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ dig "behavior" "scaleDown" "stabilizationWindowSeconds" 120 .Values.autoscaling }}
      policies:
      - type: Percent
        value: 10
        periodSeconds: {{ dig "behavior" "scaleDown" "percentPeriodSeconds" 60 .Values.autoscaling }}
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: {{ dig "behavior" "scaleUp" "stabilizationWindowSeconds" 120 .Values.autoscaling }}
      policies:
      - type: Percent
        value: {{ dig "behavior" "scaleUp" "percentValue" 900 .Values.autoscaling }}
        periodSeconds: {{ dig "behavior" "scaleUp" "percentPeriodSeconds" 30 .Values.autoscaling }}
      selectPolicy: Max
  metrics:
    {{- if .Values.autoscaling.averageUtilMem }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.averageUtilMem }}
    {{- end }}
    {{- if .Values.autoscaling.averageUtilCpu }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.averageUtilCpu }}
    {{- end }}
{{- end }}